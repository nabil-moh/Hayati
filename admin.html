<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حياتي | لوحة الإدارة</title>

<link rel="stylesheet" href="admin.css">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.password-wrap{
  position:relative
}

.password-wrap input{
  padding-left:48px
}

.password-toggle{
  position:absolute;
  left:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:transparent;
  cursor:pointer;
  font-size:20px;
  line-height:1;
  padding:4px
}

.manager-title{
  text-align:center;
  margin:0 auto 24px;
  direction:rtl;
  font-family:"Amiri","Scheherazade New","Noto Naskh Arabic",serif
}

.manager-name{
  font-size:32px;
  font-weight:700;
  line-height:1.25
}

.manager-role{
  font-size:22px;
  font-weight:600;
  margin-top:2px;
  line-height:1.3
}

.image-upload{
  border:1px dashed #d9a5b8;
  border-radius:12px;
  padding:12px;
  margin:8px 0;
  background:#fff7fa
}

.image-upload label{
  display:block;
  font-weight:700;
  margin-bottom:7px
}

.preview{
  display:block;
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:12px;
  margin-top:8px
}
</style>

<script>
function togglePassword(){
  const i=document.getElementById('password');
  const b=document.getElementById('password-toggle');

  if(!i)return;

  if(i.type==='password'){
    i.type='text';
    b.textContent='🙈';
  }else{
    i.type='password';
    b.textContent='👁️';
  }
}
</script>

</head>

<body>

<div class="wrap">

<header>
  <b>حياتي Hayati</b>
  <button id="logout" hidden>تسجيل الخروج</button>
</header>

<section id="login">

    <br>
    <span class="manager-role">المديرة</span>
